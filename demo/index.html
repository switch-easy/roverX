<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Xrover SDK | Standalone Demo Showcase</title>
  <link rel="stylesheet" href="../sdk/styles/xrover.css" />
  <style>
    body { font-family: -apple-system, sans-serif; background: #030712; color: #fff; margin: 0; padding: 40px 20px; }
    .container { max-width: 1200px; margin: 0 auto; }
    h1 { font-size: 28px; margin-bottom: 8px; }
    p { color: #9ca3af; margin-bottom: 24px; }
    .nav-bar { margin-bottom: 20px; display: flex; gap: 12px; }
    .nav-btn { background: #1f2937; border: 1px solid #374151; color: #fff; padding: 8px 16px; border-radius: 6px; cursor: pointer; }
    .nav-btn.active { background: #e11d48; border-color: #e11d48; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🚀 Xrover Standalone Embed Demo</h1>
    <p>Demonstrating autonomous 1200px Ultra-HD visual upscaling, social buzz badges, and 4-quadrant layout.</p>
    
    <div class="nav-bar">
      <button class="nav-btn active" onclick="switchTheme('dark-bbc')">BBC Dark Slate</button>
      <button class="nav-btn" onclick="switchTheme('clean-light')">Clean Studio Light</button>
      <button class="nav-btn" onclick="switchTheme('cyber-glass')">Cyber Glassmorphism</button>
    </div>

    <div id="xrover-embed-target"></div>
  </div>

  <script src="../sdk/xrover.js"></script>
  <script>
    const sampleStories = [
      { title: "Reasoning AI Neural Architectures Shatter Computational Benchmarks", description: "Next-generation semiconductor accelerators establish new efficiency breakthroughs.", category: "tech", source: "TechCrunch", pubDate: new Date(Date.now() - 10 * 60000).toUTCString(), image: "https://images.unsplash.com/photo-1518770660439-4636190af475?auto=format&fit=crop&w=1200&q=85" },
      { title: "Clean Fusion Energy Reactor Achieves Continuous Net-Power Milestone", description: "Magnetic confinement experiment maintains stable plasma equilibrium.", category: "tech", source: "Ars Technica", pubDate: new Date(Date.now() - 25 * 60000).toUTCString(), image: "https://images.unsplash.com/photo-1591799264318-7e6ef8ddb7ea?auto=format&fit=crop&w=1200&q=85" },
      { title: "Quantum Cryogenic Processors Demonstrate Fault-Tolerant Logic Gates", description: "Engineers mitigate thermal decoherence across 10,000 logical qubit registers.", category: "tech", source: "MIT Tech Review", pubDate: new Date(Date.now() - 40 * 60000).toUTCString(), image: "https://images.unsplash.com/photo-1677442136019-21780efad99a?auto=format&fit=crop&w=1200&q=85" },
      { title: "Autonomous Logistics Fleet Deployed Across Major Trans-Pacific Maritime Hubs", description: "Container terminals transition to zero-emission robotic cranes.", category: "tech", source: "Wired", pubDate: new Date(Date.now() - 60 * 60000).toUTCString(), image: "https://images.unsplash.com/photo-1485827404703-89b55fcc595e?auto=format&fit=crop&w=1200&q=85" },
      { title: "Global Cyber Defense Framework Standardizes Zero-Trust Protocols", source: "Reuters Tech", pubDate: new Date(Date.now() - 75 * 60000).toUTCString() },
      { title: "Solid-State EV Battery Cells Enter Mass Commercial Production", source: "CleanTechnica", pubDate: new Date(Date.now() - 90 * 60000).toUTCString() }
    ];

    function render(theme) {
      Xrover.mount('#xrover-embed-target', {
        theme: theme || 'dark-bbc',
        layout: 'quad',
        showBuzz: true,
        showSummaries: true,
        articles: sampleStories
      });
    }

    function switchTheme(theme) {
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
      event.target.classList.add('active');
      render(theme);
    }

    document.addEventListener('DOMContentLoaded', () => render('dark-bbc'));
  </script>
</body>
</html>
